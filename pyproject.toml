[project]
name = "agentic-ml-audit-copilot"
version = "1.0.0"
description = "Agentic ML Audit Copilot: audits tabular datasets for ML risks before model training."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "groq>=0.11.0",
    "langgraph>=1.2.8",
    "mlflow>=2.19.0,<3",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "plotly>=5.24.0",
    "protobuf<5",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.0,<2.0.0",
    "setuptools>=83.0.0",
    "streamlit>=1.58.0",
    "uvicorn[standard]>=0.30.0",
    "shap>=0.52.0",
    "numba>=0.60.0",
    "llvmlite>=0.43.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]