[project]
name = "agentic-ml-audit-copilot"
version = "1.0.0"
description = "Agentic ML Audit Copilot: audits tabular datasets for ML risks before model training."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Shivam Rajput" }]
keywords = [
    "machine-learning",
    "ml-audit",
    "agentic-ai",
    "data-quality",
    "leakage-detection",
    "streamlit",
    "fastapi",
    "mlflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "streamlit>=1.41.0,<2.0.0",
    "plotly>=5.24.0,<7.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scipy>=1.14.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "joblib>=1.4.0,<2.0.0",
    "langgraph>=0.2.70,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "mlflow>=2.19.0,<3.0.0",
    "protobuf>=4.25.0,<5.0.0",
    "groq>=0.11.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "setuptools>=70.0.0",
]

[project.optional-dependencies]
explainability = [
    "shap>=0.46.0,<0.47.0",
    "numba>=0.60.0,<0.61.0",
    "llvmlite>=0.43.0,<0.44.0",
]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
]
all = [
    "agentic-ml-audit-copilot[dev,explainability]",
]

[project.urls]
Homepage = "https://github.com/shivamrajput-ds/Agentic-ML-Audit-Copilot"
Repository = "https://github.com/shivamrajput-ds/Agentic-ML-Audit-Copilot"
Issues = "https://github.com/shivamrajput-ds/Agentic-ML-Audit-Copilot/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"