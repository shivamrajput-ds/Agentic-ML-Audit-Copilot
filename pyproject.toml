[project]
name = "agentic-ml-audit-copilot"
version = "1.1.0"
description = "Production-style Agentic ML Audit Copilot for auditing tabular datasets before model training."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Shivam Rajput" }]
keywords = [
    "agentic-ai",
    "data-quality",
    "fastapi",
    "human-in-the-loop",
    "leakage-detection",
    "machine-learning",
    "ml-audit",
    "mlflow",
    "shap",
    "streamlit",
    "tabular-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "groq>=0.11.0,<1.0.0",
    "joblib>=1.4.0,<2.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langgraph>=0.2.70,<1.0.0",
    "mlflow>=2.19.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "plotly>=5.24.0,<7.0.0",
    "protobuf>=4.25.0,<6.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pytz>=2024.2,<2027.0",
    "pyyaml>=6.0.0,<7.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.14.0,<2.0.0",
    "setuptools>=70.0.0",
    "six>=1.17.0,<2.0.0",
    "streamlit>=1.41.0,<2.0.0",
    "tzdata>=2024.2,<2027.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "iniconfig>=2.0.0,<3.0.0",
    "pytest>=8.3.4,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "ruff>=0.8.0,<1.0.0",
]
explainability = [
    "llvmlite>=0.43.0,<0.45.0",
    "matplotlib>=3.8.0,<4.0.0",
    "numba>=0.60.0,<0.62.0",
    "shap>=0.46.0,<0.49.0",
]
all = [
    "agentic-ml-audit-copilot[dev,explainability]",
]

[project.urls]
Homepage = "https://github.com/shivamrajput-ds/Agentic-ML-Audit-Copilot"
Repository = "https://github.com/shivamrajput-ds/Agentic-ML-Audit-Copilot"
Issues = "https://github.com/shivamrajput-ds/Agentic-ML-Audit-Copilot/issues"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
exclude = ["tests*", "data*", "logs*", "reports*", "artifacts*", "mlruns*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --disable-warnings --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: tests that take longer than normal unit tests",
    "integration: tests that touch APIs, MLflow, Streamlit, or filesystem-heavy workflows",
]

[tool.coverage.run]
branch = true
source = ["src", "app"]
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    ".cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "artifacts",
    "data/uploads",
    "logs",
    "mlruns",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"app/api.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
