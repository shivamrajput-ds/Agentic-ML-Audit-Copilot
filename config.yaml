project:
  name: "Agentic ML Audit Copilot"
  version: "1.0.0"
  author: "Shivam Rajput"
  license: "MIT"

random_seed: 42

logging:
  log_level: "INFO"
  console_logging: true
  file_logging: true
  log_file: "logs/app.log"
  max_bytes: 5000000
  backup_count: 5

dataset:
  max_rows: 1000000
  sample_large_dataset: true
  profiling_sample_rows: 100000
  allowed_extensions:
    - ".csv"
  max_categories: 10
  large_file_warning_mb: 100

audit:
  high_missing_threshold: 50
  high_cardinality_threshold: 50
  id_unique_percent_threshold: 95
  near_constant_threshold: 95

missing_values:
  warning_threshold: 20
  high_threshold: 50

outliers:
  enabled: true
  method: "iqr"
  iqr_multiplier: 1.5

correlation:
  enabled: true
  threshold: 0.90

imbalance:
  low_ratio_threshold: 1.5
  moderate_ratio_threshold: 3
  high_ratio_threshold: 10
  rare_class_threshold_percent: 5

leakage:
  high_correlation_threshold: 0.90
  classification_proxy_threshold: 0.75
  duplicate_target_threshold: 0.95
  encoded_target_correlation_threshold: 0.90
  mutual_information_threshold: 0.20
  target_like_keywords:
    - "target"
    - "label"
    - "outcome"
    - "result"
    - "final_result"
    - "prediction"
    - "predicted"
    - "actual"
    - "ground_truth"
    - "grade"
    - "score"
    - "rank"
    - "pass"
    - "fail"
    - "status"
    - "class"
    - "total"

metrics:
  classification_default: "f1_weighted"
  regression_default: "rmse"

training:
  test_size: 0.2
  random_state: 42

modeling:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  enable_cross_validation: true
  max_training_time_seconds: 300
  random_forest_estimators: 200
  random_forest_min_samples_leaf: 2
  logistic_max_iter: 1000

preprocessing:
  numeric_imputer_strategy: "median"
  categorical_imputer_strategy: "most_frequent"
  scale_numeric: true
  drop_id_like_columns: true
  drop_high_cardinality_columns: false

workflow:
  node_retry_attempts: 1
  node_retry_sleep_seconds: 0.5
  skip_imbalance_for_regression: true

mlflow:
  enabled: true
  tracking_uri: null
  experiment_name: "agentic_ml_audit_baselines"
  log_models: true
  log_artifacts: true
  artifact_path: "baseline_model"

cache:
  enabled: true
  directory: ".cache"

performance:
  parallel_jobs: -1

api:
  max_upload_mb: 25
  cleanup_uploaded_files: true
  allowed_extensions:
    - ".csv"
  cors_allow_origins:
    - "*"
  request_id_header: "X-Request-ID"
  expose_headers:
    - "X-Request-ID"

streamlit:
  max_upload_mb: 25
  cleanup_uploaded_files: false
  theme: "dark"
  allowed_extensions:
    - ".csv"
  show_raw_json: true

reports:
  output_dir: "reports"
  default_report_path: "reports/audit_report.md"
  save_json: true
  save_markdown: true

llm:
  enabled: true
  provider: "groq"
  model: "openai/gpt-oss-120b"
  temperature: 0.2
  max_tokens: 2000
  timeout: 120
  max_retries: 3
  retry_base_seconds: 1
  cache_enabled: true
  cache_dir: "artifacts/report_cache"
  hallucination_guard_enabled: true
  prompt_version: "v1"

security:
  allow_pickle_loading: false
  sanitize_downloads: true

drift:
  enabled: false

explainability:
  enabled: true
  run_shap: true
  max_samples: 200
  top_n_features: 20
  generate_plots: true
  plot_max_features: 20

visualization:
  dpi: 150
  style: "plotly"

problem_detection:
  classification_unique_threshold: 20
