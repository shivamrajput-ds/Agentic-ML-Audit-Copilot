name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"

    env:
      PYTHONPATH: .
      LLM_ENABLED: "false"
      GROQ_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv .venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt --python .venv/bin/python
          uv pip install -e . --python .venv/bin/python
          uv pip install ruff pytest --python .venv/bin/python

      - name: Verify environment
        run: |
          uv run --python .venv/bin/python python --version
          uv run --python .venv/bin/python ruff --version
          uv run --python .venv/bin/python python -m pytest --version

      - name: Ruff lint
        run: uv run --python .venv/bin/python ruff check .

      - name: Ruff format check
        run: uv run --python .venv/bin/python ruff format --check .

      - name: Run tests
        run: uv run --python .venv/bin/python python -m pytest -q

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-artifacts
          path: |
            logs/
            reports/
            artifacts/
          if-no-files-found: ignore